[workspace]
members = ["engine", "mac/bindgen"]
resolver = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

# Builds the engine for the Mac app's Debug configuration: fast, without LTO.
[profile.mac-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
